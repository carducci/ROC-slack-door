[package]
name = "roc-slack-door-server"
version = "0.0.0"
description = "The door: holds the Slack Socket Mode connection and serves roc-slack-door's resources for another kernel to mount"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "roc-slack-door"
path = "src/main.rs"

[dependencies]
roc-slack-door = { path = "../slack" }
async-trait = "0.1"
futures-executor = "0.3"
ikigai-core = "=0.1.98"
ikigai-intray = "=0.1.64"
ikigai-ipc = "=0.1.64"
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
