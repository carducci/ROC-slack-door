# The workspace. Empty until slack-resources 1.2 adds artifacts/slack (the library) and
# artifacts/door (the binary).
[workspace]
resolver = "2"
members = ["artifacts/slack"]

# What every crate here shares; each one says `license.workspace = true` and so on.
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/carducci/ROC-slack-door"
authors = ["Michael Carducci"]
